# Starts everything: SQL Server 2022, the API and the Notifications service.
#   docker compose up --build
# API + Swagger: http://localhost:5000     SQL Server (SSMS): localhost,1433  login: sa
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  notifications:
    build:
      context: .
      dockerfile: src/HireFlow.Notifications/Dockerfile
    ports:
      - "5001:8080"

  api:
    build:
      context: .
      dockerfile: src/HireFlow.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
      notifications:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: "Server=sqlserver,1433;Database=HireFlowDb;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Key: ${JWT_KEY}
      Notifications__Mode: Http
      Notifications__BaseUrl: http://notifications:8080/
      Cors__Origins__0: http://localhost:4200
      Cors__Origins__1: http://localhost:3000
    ports:
      - "5000:8080"
    volumes:
      - cv-data:/app/cv-files

volumes:
  sqlserver-data:
  cv-data:
